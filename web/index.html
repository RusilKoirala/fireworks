<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireworks</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 class="hea">Fireworks</h1>

    <img
      class="imgg"
      src="../asset/terminal.png"
      alt="Fireworks terminal preview"
    />

    <p class="desc">
      Fireworks is a terminal software that allows you to light up the terminal
    </p>

    <div class="btr">
      <button onclick="Download()">Download</button>
      <button onclick="openGithub()">Github</button>
    </div>
    <h2 style="text-align: center">For macOS / Linux</h1>
    <div class="script-area">
      <textarea class="text-area" id="text">Script: https://</textarea>

      <button class="copy-btn" onclick="copy()">Copy</button>
    </div>

    <script>
      async function Download() {
        // TODO: Add your actual file URL here
        const url = "https://example.com/your-file.zip";

        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const blob = await response.blob();
          const blobUrl = URL.createObjectURL(blob);

          const link = document.createElement("a");
          link.href = blobUrl;
          link.download = "fireworks.zip";

          document.body.appendChild(link);
          link.click();

          link.remove();
          URL.revokeObjectURL(blobUrl);
        } catch (error) {
          console.error("Download failed:", error);
          window.alert("Error downloading file.");
        }
      }

      function openGithub() {
        window.location.href = "https://github.com/rusilkoirala/fireworks";
      }

      async function copy() {
        const textArea = document.getElementById("text");

        const text = textArea.value.trim();

        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          console.error("Failed to copy:", err);
        }
      }
    </script>
  </body>
</html>
