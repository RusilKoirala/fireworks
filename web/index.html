<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireworks</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 class="hea">Fireworks</h1>

    <img class="imgg" src="./terminal.png" alt="Fireworks terminal preview" />

    <p class="desc">
      Fireworks is a terminal software that allows you to light up the terminal
    </p>

    <div class="btr">
      <button onclick="Download()">Download</button>
      <button onclick="openGithub()">Github</button>
    </div>

    <h2 style="text-align: center">For macOS / Linux</h2>
    <div class="script-area">
      <textarea class="text-area" id="text" readonly>
curl -fsSL https://raw.githubusercontent.com/RusilKoirala/fireworks/main/install.sh | sh</textarea
      >
      <button class="copy-btn" onclick="copy()">Copy</button>
    </div>

    <script>
      const BASE =
        "https://github.com/RusilKoirala/fireworks/releases/latest/download/";

      function pickFile() {
        const ua = navigator.userAgent.toLowerCase();
        if (ua.includes("win")) return "fireworks-setup.exe";
        if (ua.includes("mac")) return "fireworks-darwin-arm64.tar.gz"; // most Macs are Apple Silicon now
        if (ua.includes("linux")) {
          return ua.includes("aarch64") || ua.includes("arm")
            ? "fireworks-linux-arm64.tar.gz"
            : "fireworks-linux-amd64.tar.gz";
        }
        return null;
      }

      function Download() {
        const file = pickFile();
        if (!file) {
          window.location.href =
            "https://github.com/RusilKoirala/fireworks/releases/latest";
          return;
        }
        window.location.href = BASE + file;
      }

      function openGithub() {
        window.location.href = "https://github.com/RusilKoirala/fireworks";
      }

      async function copy() {
        const text = document.getElementById("text").value.trim();
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          console.error("Failed to copy:", err);
        }
      }
    </script>
  </body>
</html>
