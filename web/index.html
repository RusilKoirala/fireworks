<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireworks</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 class="hea">Fireworks</h1>

    <img class="imgg" src="../asset/terminal.png" />

    <p class="desc">
      Fireworks is a terminal software that allows you to light up the terminal
    </p>

    <div class="btr">
      <button class="" onClick="Download()">Download</button>
      <button class="" onclick="openGithub()">Github</button>
    </div>

    <div>
      <h1>For macOS / Linux</h1>
    </div>
  </body>

  <script>
    async function Download() {
      const url = "";

      try {
        const response = await fetch(url);

        const blob = await response.blob();

        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = blobUrl;

        link.download;
        document.body.appendChild(link);
        link.click();

        link.remove();
        URL.revokeObjectURL(blobUrl);
      } catch (error) {
        console.error("Download failed:", error);
        window.alert("error downloading");
      }
    }

    function openGithub() {
      window.location.href = "https://github.com/rusilkoirala/fireworks";
    }
  </script>
</html>
